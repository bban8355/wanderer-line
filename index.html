
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>流浪者炒飯｜LINE社群預訂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 18px;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: Arial, "Noto Sans TC", sans-serif;
      color: #222;
    }

    .container {
      max-width: 440px;
      margin: 35px auto;
      text-align: center;
    }

    .header {
      background: #292929;
      color: white;
      padding: 38px 15px;
      border-radius: 18px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 12px;
    }

    .subtitle {
      font-size: 15px;
      color: #ddd;
      margin: 0;
    }

    .description {
      font-size: 15px;
      line-height: 1.9;
      margin-bottom: 25px;
    }

    .line-button {
      display: block;
      background: #06c755;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      padding: 22px 10px;
      margin-bottom: 18px;
      font-size: 21px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
    }

    .line-button:active {
      background: #05a847;
    }

    .small {
      display: block;
      font-size: 13px;
      font-weight: normal;
      margin-top: 8px;
    }

    .notice {
      font-size: 13px;
      color: #777;
      line-height: 1.9;
      margin-top: 28px;
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>🚚 流浪者職人炒飯</h1>
      <p class="subtitle">
        有主餐的炒飯｜現點現做
      </p>
    </header>

    <div class="description">
      歡迎加入流浪者炒飯 LINE 社群！<br>
      查看每週餐車行程、提前預訂美食。<br>
      請選擇下方社群加入👇
    </div>

    <a class="line-button"
       href="https://line.me/ti/g2/7OH873hKv8kpD4VHKNR_QF_fWKSBkz6YpwC6dA"
       target="_top">
      💬 LINE 1群｜點我加入
      <span class="small">
        流浪者炒飯｜記事本預訂

    <a class="line-button"
       href="https://line.me/ti/g2/gZQzSOPGf-JHRUYtn_DTf9hjaQePlNS09OLm_A"
       target="_top">
      💬 LINE 2群｜點我加入

    <div class="notice">
      📌 加入社群後，請至記事本查看預訂資訊。<br>
      📌 若1群已滿，歡迎加入2群。<br>
      📌 若無法開啟LINE，請使用Safari瀏覽器。
    </div>

    <div class="footer">
      © 流浪者職人炒飯
    </div>

  </main>

</body>
</html>
